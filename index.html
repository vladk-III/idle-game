<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1d2a24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Branch Line">
  <meta name="description" content="A calm idle railway tycoon with a focus mode for classes and meetings.">
  <title>Branch Line</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="map"></canvas>

    <header id="top">
      <div class="money-block">
        <div id="money">$0</div>
        <div id="income">+$0/min</div>
      </div>
      <div class="right-block">
        <div id="date">Jan 1850</div>
        <button id="tokens" class="chip" aria-label="Focus tokens">◉ 0</button>
      </div>
    </header>

    <div id="banner" hidden></div>

    <nav id="bottom">
      <button id="btnLines"><span class="ic">🛤️</span><span>Lines</span></button>
      <button id="btnFocus" class="focus-btn"><span class="ic">🎧</span><span>Focus</span></button>
      <button id="btnPerks"><span class="ic">✨</span><span>Perks</span></button>
      <button id="btnMenu"><span class="ic">⚙️</span><span>Menu</span></button>
    </nav>

    <section id="sheet" aria-hidden="true">
      <button class="sheet-close" data-act="close" aria-label="Close">✕</button>
      <div id="sheetBody"></div>
    </section>

    <div id="toasts"></div>

    <div id="focus" hidden>
      <canvas id="ride"></canvas>
      <canvas id="focusMap" hidden></canvas>
      <div id="dim"></div>
      <div class="fhud ftop">
        <div id="fMoney">$0</div>
        <div class="ftimer">
          <svg viewBox="0 0 40 40" class="ring"><circle cx="20" cy="20" r="17" class="ring-bg"/><circle cx="20" cy="20" r="17" class="ring-fg" id="fRing"/></svg>
          <div><div id="fTime">0:00</div><div class="fsub" id="fTok">◉ in 5:00</div></div>
        </div>
        <div class="fbtns">
          <button id="fScene" aria-label="Switch view">🚂</button>
          <button id="fExit" aria-label="Exit focus">✕</button>
        </div>
      </div>
      <div class="fhud fbottom">
        <div id="fRoute">—</div>
        <div class="fbar"><div id="fProg"></div></div>
        <div id="fCargo" class="fsub"></div>
        <div id="fHint">tap: steam · hold: whistle · swipe: other train</div>
      </div>
    </div>

    <div id="modal" hidden><div class="card" id="modalBody"></div></div>
  </div>
  <script type="module" src="js/main.js"></script>
  <script>
    // If the game hasn't started (a broken or half-updated offline copy),
    // clear the offline cache and load fresh, once.
    // The game's scripts run before the page's load event, so if it isn't up
    // by then something failed to load.
    window.addEventListener('load', function () { setTimeout(function () {
      if (window.branchline || !('serviceWorker' in navigator)) return;
      try { if (sessionStorage.getItem('bl-heal')) return; sessionStorage.setItem('bl-heal', '1'); } catch (e) { return; }
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
        window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null,
      ]).then(function () { location.reload(); });
    }, 1500); });
  </script>
</body>
</html>
